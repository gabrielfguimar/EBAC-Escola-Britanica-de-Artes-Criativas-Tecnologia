services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: minhasenhasegura
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=jdbc:postgresql://db:5432/appdb
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=minhasenhasegura
    depends_on:
      - db