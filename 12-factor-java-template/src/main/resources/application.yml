server:
  port: ${PORT:8080} # Fator VII: Vinculação dinâmica de porta externa

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/appdb} # Fator IV: Link dinâmico
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update